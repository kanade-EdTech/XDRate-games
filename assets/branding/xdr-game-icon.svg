<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">XDRate Games icon</title>
  <desc id="desc">A combat-styled X paired with a Nintendo Switch right Joy-Con inspired D, in PlayStation blue and Steam blue-gray.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#1b355b"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="1" stop-color="#2f73b9"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#557ea8"/>
      <stop offset="1" stop-color="#263e62"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050b18" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bg)"/>
  <path d="M100 730 L235 595 M115 835 L300 650 M700 180 L850 70" stroke="#66c0f4" stroke-width="18" stroke-linecap="round" opacity=".22"/>
  <path d="M150 180 L830 860" stroke="#fff" stroke-opacity=".04" stroke-width="3"/>

  <!-- combat X: two offset blades with a central cut -->
  <g filter="url(#shadow)">
    <path d="M168 228 L326 228 L505 405 L690 220 L848 220 L590 504 L852 792 L690 792 L505 608 L324 792 L164 792 L420 504 Z" fill="url(#x)" stroke="#9bdcff" stroke-width="8" stroke-linejoin="round"/>
    <path d="M236 272 L326 272 L505 449 L691 264 L780 264 L550 504 L780 748 L691 748 L505 559 L322 748 L232 748 L460 504 Z" fill="#0b1730" opacity=".72"/>
    <path d="M185 214 L360 389 M665 619 L838 794" stroke="#e9f7ff" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- D / right Joy-Con silhouette -->
  <g filter="url(#shadow)">
    <path d="M684 190 C752 156 846 173 887 226 C915 262 926 313 926 386 L926 690 C926 766 885 824 823 839 C779 849 739 827 721 792 C704 760 704 716 704 670 L704 359 C704 322 700 286 681 257 C663 230 660 204 684 190 Z" fill="url(#d)" stroke="#b8d4ec" stroke-width="8"/>
    <path d="M748 258 C789 237 843 253 863 286" fill="none" stroke="#66c0f4" stroke-width="13" stroke-linecap="round" opacity=".8"/>
    <circle cx="813" cy="392" r="49" fill="#101e38" stroke="#8db9dc" stroke-width="8"/>
    <circle cx="813" cy="392" r="16" fill="#66c0f4"/>
    <circle cx="779" cy="545" r="13" fill="#12213b" stroke="#b8d4ec" stroke-width="6"/>
    <circle cx="847" cy="545" r="13" fill="#12213b" stroke="#b8d4ec" stroke-width="6"/>
    <rect x="789" y="661" width="48" height="15" rx="7" fill="#66c0f4" opacity=".9"/>
  </g>

  <!-- notch makes the D read as a letter, not only a controller -->
  <path d="M704 470 L759 470 L759 540 L704 540 Z" fill="#0b1730" opacity=".95"/>
  <text x="512" y="930" text-anchor="middle" fill="#b8d4ec" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="10">XDRATE GAMES</text>
</svg>
